name: Loop

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log what would change"
        type: boolean
        default: false
  # پشتیبان مستقل از تلگرام: اگر پیام‌های زمان‌بندی یا خود بات از کار بیفتند،
  # صف هر روز ساعت ۰۰:۳۰ UTC (۰۴:۰۰ تهران، نیم ساعت قبل از rebuild) پر می‌شود.
  # cron گیت‌هاب همیشه UTC است.
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write   # برای کامیت آینه‌ی صف و heartbeat

concurrency:
  group: loop
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refill queue
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          LOOP_CHAT_ID: ${{ secrets.LOOP_CHAT_ID }}
          COLLECT_CHAT_ID: ${{ secrets.COLLECT_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
        run: python -m loop_trigger

      # آینه‌ی صف (state/queue.json) را برای بات منتشر می‌کند و با heartbeat روزانه،
      # تایمر «۶۰ روز بی‌فعالیتی» گیت‌هاب را صفر نگه می‌دارد تا cron خاموش نشود.
      - name: Publish queue mirror + heartbeat
        # فقط از شاخه‌ی اصلی، چون بات state/queue.json را از main می‌خواند
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p state
          printf '{"heartbeat_utc":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > state/heartbeat.json
          git config user.name  "loop-trigger[bot]"
          git config user.email "loop-trigger@users.noreply.github.com"
          git add state/heartbeat.json
          if [ -f state/queue.json ]; then git add state/queue.json; fi
          if [ -f state/queue_collect.json ]; then git add state/queue_collect.json; fi
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "state: queue mirror $(date -u +%FT%TZ)"
            git push
          fi
